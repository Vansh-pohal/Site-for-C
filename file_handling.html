  <script >
function showCode(id) {
  const box = document.getElementById(id);
  box.style.opacity = 1;
  box.style.pointerEvents = "auto"; // make it clickable
}

function hideCode(id) {
  const box = document.getElementById(id);
  box.style.opacity = 0;
  box.style.pointerEvents = "none"; // disable interaction
